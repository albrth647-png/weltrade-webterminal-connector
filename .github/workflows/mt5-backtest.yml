name: MT5 backtest (una pasada -> CSV)
# Prueba de 30 min del EA adversario: instala MT5 sobre Wine en un runner Ubuntu
# (la receta que ya funciono en MT5 Lab), entra en la demo, compila el EA y corre
# UNA pasada del Strategy Tester. Solo se baja el artifact con los CSV.
#
# Secrets: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER (admite "a;b;c" para probar varios).
on:
  workflow_dispatch:
    inputs:
      simbolo:
        description: "Simbolo (admite varios separados por ;)"
        default: "FX Vol 20"
        required: true
      periodo:
        description: "Periodo del tester (M1/M3/M5/M15)"
        default: "M3"
        required: true
      desde:
        description: "Desde (2026.10.21)"
        default: "2026.10.21"
        required: true
      hasta:
        description: "Hasta (2026.11.20)"
        default: "2026.11.20"
        required: true
      limite_min:
        description: "Minutos maximos del tester"
        default: "30"
        required: true

permissions:
  contents: read

concurrency:
  group: mt5-backtest
  cancel-in-progress: false

env:
  BT_SIMBOLO: ${{ github.event.inputs.simbolo }}
  BT_PERIODO: ${{ github.event.inputs.periodo }}
  BT_DESDE: ${{ github.event.inputs.desde }}
  BT_HASTA: ${{ github.event.inputs.hasta }}
  BT_LIMITE_MIN: ${{ github.event.inputs.limite_min }}

jobs:
  # MetaEditor no termina nunca bajo Wine, pero en Windows compila en segundos.
  compilar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar MetaTrader 5
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList '/auto' -Wait
          $dir = 'C:\Program Files\MetaTrader 5'
          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path "$dir\terminal64.exe") { break }
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path "$dir\terminal64.exe")) { throw 'MT5 no quedo instalado' }

      - name: Compilar el EA
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\MetaTrader 5'
          $dst = "$dir\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path 'mt5-ea\EstrategiaAdversaria.mq5' -Destination $dst -Force
          Start-Process -FilePath "$dir\metaeditor64.exe" `
            -ArgumentList "/compile:`"$dst\EstrategiaAdversaria.mq5`"", "/log:`"$env:RUNNER_TEMP\compile.log`"" `
            -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$env:RUNNER_TEMP\compile.log") {
            Get-Content "$env:RUNNER_TEMP\compile.log" -Encoding Unicode | Select-Object -Last 15
          }
          $ex5 = "$dst\EstrategiaAdversaria.ex5"
          if (-not (Test-Path $ex5)) { throw 'el EA no compilo (.ex5 ausente)' }
          New-Item -ItemType Directory -Force -Path bot_dir | Out-Null
          Copy-Item $ex5 -Destination 'bot_dir\EstrategiaAdversaria.ex5' -Force
          Write-Host "ex5: $((Get-Item 'bot_dir\EstrategiaAdversaria.ex5').Length) bytes"

      - name: Subir el .ex5
        uses: actions/upload-artifact@v4
        with:
          name: ea-ex5
          path: bot_dir/EstrategiaAdversaria.ex5
          retention-days: 7

  bt:
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secrets
        env:
          S_LOGIN: ${{ secrets.MT5_LOGIN }}
          S_PASS: ${{ secrets.MT5_PASSWORD }}
          S_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          falta=""
          [ -z "$S_LOGIN" ] && falta="$falta MT5_LOGIN"
          [ -z "$S_PASS" ] && falta="$falta MT5_PASSWORD"
          [ -z "$S_SERVER" ] && falta="$falta MT5_SERVER"
          if [ -n "$falta" ]; then echo "Faltan secrets:$falta"; exit 1; fi
          echo "Secrets presentes. Servidor(es) declarados: $(echo "$S_SERVER" | tr ';' ' ')"

      - name: Sistema (Wine + Xvfb)
        run: |
          set -e
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb winbind unzip xdotool > /dev/null
          sudo mkdir -pm755 /usr/share/keyrings
          sudo wget -qO /usr/share/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          CODENAME="$(. /etc/os-release && echo $VERSION_CODENAME)"
          sudo wget -qO "/etc/apt/sources.list.d/winehq-${CODENAME}.sources" \
            "https://dl.winehq.org/wine-builds/ubuntu/dists/${CODENAME}/winehq-${CODENAME}.sources" \
            || sudo rm -f "/etc/apt/sources.list.d/winehq-${CODENAME}.sources"
          (sudo apt-get update -qq && sudo apt-get install -y -qq --install-recommends winehq-stable > /dev/null) \
            || (sudo rm -f /etc/apt/sources.list.d/winehq-*.sources && sudo apt-get update -qq \
                && sudo apt-get install -y -qq wine wine64 wine32 > /dev/null)
          wine --version

      - name: Traer el .ex5 compilado y el instalador cacheado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bot_dir
          gh release download bot-assets --pattern "mt5setup.exe" --dir bot_dir \
            --repo "$GITHUB_REPOSITORY" || true
          ls -la bot_dir

      - name: Bajar el .ex5 del job de compilacion
        uses: actions/download-artifact@v4
        with:
          name: ea-ex5
          path: bot_dir

      - name: Comprobar el .ex5
        run: ls -la bot_dir && test -s bot_dir/EstrategiaAdversaria.ex5

      - name: Backtest en MT5 (Wine)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python3 scripts_re/lab/mt5_backtest_linux.py

      - name: Resumen en la pagina del run
        if: always()
        run: |
          if [ -f resumen.md ]; then cat resumen.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-${{ github.run_number }}
          path: bt_out
          retention-days: 14
          if-no-files-found: warn
